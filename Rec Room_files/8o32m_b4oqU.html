<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rec Room Trailer Player</title>
    <style>
    html, body { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background-color: transparent; 
    }
    video { 
        width: 100vw;   /* Force the video width to match the mobile viewport width */
        height: 100vh;  /* Force the video height to match the mobile viewport height */
        object-fit: cover; /* Stretches the video cleanly to ensure NO blank gaps appear on mobile */
    }
</style>

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <!-- Plays a direct clean archive stream of the 2022 trailer -->
    <video autoplay muted loop controls playsinline>
        <source src="trailer.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</body>
</html>
